<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SD DOS CARAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040f;--ink:#f4f0ff;--mute:#a99fc9;--neon:#8b5cf6;--glow:#b79cff;--line:#2a1f4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden;min-height:100vh}
.streak{position:fixed;height:2px;width:70vw;background:linear-gradient(90deg,transparent,var(--glow),transparent);box-shadow:0 0 14px var(--neon);transform:rotate(-12deg);opacity:.55;pointer-events:none;animation:slide 1.4s ease-out both}
.s1{top:14%;left:-10%}.s2{top:58%;right:-15%;transform:rotate(-8deg);animation-delay:.25s;opacity:.4}.s3{top:82%;left:-20%;width:90vw;transform:rotate(-5deg);animation-delay:.5s;opacity:.3}
@keyframes slide{from{translate:-40vw 0;opacity:0}}
main{position:relative;max-width:640px;margin:0 auto;padding:48px 24px 32px;text-align:center}
.icon{width:min(240px,62vw);aspect-ratio:1;border-radius:28px;border:1px solid var(--line);box-shadow:0 0 60px rgba(139,92,246,.45);display:block;margin:0 auto 32px}
h1{font-style:italic;font-weight:900;font-size:clamp(2.4rem,11vw,4.2rem);line-height:1;margin:0 0 16px;letter-spacing:-.01em;text-shadow:3px 3px 0 var(--neon),0 0 28px rgba(139,92,246,.6)}
.lead{font-size:1.15rem;color:var(--mute);margin:0 auto 32px;max-width:34ch}
.btn{display:inline-block;background:var(--neon);color:#fff;font-weight:600;font-size:1.1rem;padding:16px 36px;border-radius:999px;text-decoration:none;box-shadow:0 0 28px rgba(139,92,246,.6);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(139,92,246,.9)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.about{margin:56px 0 0;padding:0;list-style:none;display:grid;gap:0;text-align:left;border-top:1px solid var(--line)}
.about li{padding:18px 4px;border-bottom:1px solid var(--line)}
.about b{display:block;font-weight:600;color:var(--ink)}
.about span{color:var(--mute)}
footer{position:relative;text-align:center;color:var(--mute);font-size:.9rem;padding:8px 24px 40px}
@media(prefers-reduced-motion:reduce){.streak{animation:none}.btn{transition:none}}
</style>
</head>
